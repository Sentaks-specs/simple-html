<html>
<head>
  <title>Account Log In</title>
</head>
<body bgcolor="#0d0d12" text="#ffffff" link="#ffd400" vlink="#ffd400" alink="#ff2a3d">

  <br>

  <table align="center" border="4" bordercolor="#ffd400" bgcolor="#1c1c24" cellpadding="20" width="420">
    <tr>
      <td>

        <center>
          <img src="CTU_new_logo.png" alt="Cebu Technological University Logo" width="80" height="80">
        </center>

        <h1><font color="#c8844a">ACCOUNT LOG IN</font></h1>

        <p><font color="#ff2a3d">&#9650; YOU NEED TO LOG-IN BEFORE PROCEEDING</font></p>

        <form action="dashboard.html" method="get">
          <table cellpadding="8">
            <tr>
              <td bgcolor="#ffd400"><font color="#000000"><b>USERNAME</b></font></td>
              <td><input type="text" size="25" required pattern="student" title="Wrong username"></td>
            </tr>
            <tr>
              <td bgcolor="#ffd400"><font color="#000000"><b>PASSWORD</b></font></td>
              <td><input type="password" size="25" required pattern="goodstudent123" title="Wrong password"></td>
            </tr>
          </table>

          <br>

          <input type="submit" value="submit">
          <input type="reset" value="reset">
        </form>

        <p><font color="#00e5ff" size="2">// SYSTEM ONLINE // AUTHORIZED USERS ONLY</font></p>

      </td>
    </tr>
  </table>

</body>
</html>
